name: Build UDS Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-uds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repo Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # --- NEW: Required for multi-arch builds (ARM64/Mac) ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push UDS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: uds.Dockerfile
          # --- NEW: Build for both Intel (amd64) and Mac (arm64) ---
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-uds:latest
            ghcr.io/${{ env.REPO_LOWER }}-uds:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max